<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>l3omda dev</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }

      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #000;
        border-bottom: 1px solid #fff;
      }

      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
        filter: grayscale(100%);
      }

      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #fff;
        vertical-align: middle;
      }

      /* Loading spinner */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #333;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
        color: #fff;
      }

      #wrap {
        padding: 0;
      }

      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }

      body.fail #spin {
        display: none;
      }

      body.fail #msg {
        display: block;
      }

      /* ?log=1 */
      body.log #spin,
      body.log #msg {
        display: none;
      }

      body.log #wrap {
        padding: 14px 18px;
      }

      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
        color: #fff;
      }

      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #080808;
        border: 1px solid #fff;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
        color: #fff;
      }

      /* Black & White status colors */
      .ok,
      .safe {
        color: #fff;
      }

      .bad,
      .danger {
        color: #aaa;
      }

      .warn {
        color: #ccc;
      }

      code {
        color: #ddd;
      }
    </style>
  </head>

  <body>
    <div id="brand">
      <img
        src="l3omda_logo.png"
        alt="l3omda dev"
      />

      <b>l3omda dev</b>
    </div>

    <div id="spin"></div>

    <div id="msg">
      l3omda dev
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
  </body>
</html>
